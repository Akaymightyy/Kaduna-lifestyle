<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f4d3a" />
<title>Kaduna Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
<style>
  :root { --green:#0f4d3a; --cream:#f6f1e7; --ink:#12261e; --gold:#f2b134; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fd4f5; font-family:'Poppins',system-ui,sans-serif; color:var(--ink); touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui.hidden .hideable { display:none !important; }
  .card { background:var(--cream); border-radius:16px; box-shadow:0 2px 0 rgba(15,77,58,.18), 0 6px 16px rgba(0,0,0,.18); }
  .btn { pointer-events:auto; background:var(--cream); color:var(--green); border:2.5px solid var(--green); border-radius:16px; width:54px; height:54px; display:flex; align-items:center; justify-content:center; font:700 26px/1 'Poppins',sans-serif; box-shadow:0 3px 0 var(--green); cursor:pointer; padding:0; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--green); }
  .btn.wide { width:auto; padding:0 12px; height:48px; font-size:15px; gap:6px; }
  .btn.on { background:var(--green); color:var(--cream); }
  .btn svg { width:26px; height:26px; }
  .top-left { position:absolute; left:12px; top:calc(12px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .chip { display:flex; align-items:center; gap:8px; padding:7px 13px; font-weight:600; font-size:14px; }
  .chip.title { font-size:18px; font-weight:700; padding:8px 15px; }
  .chip small { display:block; font-weight:500; font-size:11px; opacity:.6; line-height:1.1; }
  .tip { padding:8px 12px; font-size:12px; max-width:230px; line-height:1.35; }
  .tip b { color:var(--green); }
  #minimap { position:absolute; right:12px; top:calc(12px + env(safe-area-inset-top)); width:110px; height:110px; border-radius:20px; border:4px solid var(--cream); box-shadow:0 4px 14px rgba(0,0,0,.3); overflow:hidden; background:#cbd9a8; pointer-events:auto; }
  #minimap canvas { width:100%; height:100%; display:block; }
  .mm-label { position:absolute; left:6px; bottom:5px; background:rgba(15,77,58,.9); color:#fff; font-size:10px; font-weight:600; padding:1px 7px; border-radius:9px; }
  .right-col { position:absolute; right:12px; top:calc(130px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  #joy { position:absolute; left:calc(22px + env(safe-area-inset-left)); bottom:calc(26px + env(safe-area-inset-bottom)); width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid rgba(255,255,255,.85); pointer-events:auto; touch-action:none; }
  #joy i { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .bottom-right { position:absolute; right:12px; bottom:calc(26px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; }
  #eye-solo { position:absolute; right:12px; bottom:calc(26px + env(safe-area-inset-bottom)); display:none; pointer-events:auto; }
  #ui.hidden #eye-solo { display:flex; }
  #toast { position:absolute; left:50%; top:calc(150px + env(safe-area-inset-top)); transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 16px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; transition:opacity .25s; white-space:nowrap; z-index:30; }
  #toast.show { opacity:1; }

  /* HUD: needs + money + dock */
  #hud-dock { position:absolute; left:12px; bottom:calc(166px + env(safe-area-inset-bottom)); pointer-events:none; display:flex; flex-direction:column; gap:6px; }
  .needs-row { display:flex; gap:4px; flex-wrap:wrap; max-width:200px; }
  .need-item { display:flex; align-items:center; gap:3px; background:var(--cream); border-radius:10px; padding:3px 6px; font-size:10px; font-weight:600; }
  .need-bar { width:30px; height:5px; border-radius:3px; background:#e0ddd5; overflow:hidden; }
  .need-bar i { display:block; height:100%; border-radius:3px; transition:width .3s, background .3s; }
  .money-chip { display:flex; align-items:center; gap:6px; background:var(--green); color:#fff; border-radius:12px; padding:6px 12px; font-size:14px; font-weight:700; }
  .rank-chip { font-size:11px; font-weight:600; opacity:.85; }
  .phone-btn { pointer-events:auto; background:var(--gold); color:var(--ink); border:2.5px solid var(--ink); border-radius:16px; width:54px; height:54px; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 3px 0 var(--ink); cursor:pointer; }

  /* Phone modal */
  #phone-modal { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
  #phone-modal.show { display:flex; }
  #phone-card { background:var(--cream); border-radius:24px; width:min(340px, 90vw); max-height:70vh; overflow-y:auto; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  #phone-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  #phone-header h3 { margin:0; font-size:18px; color:var(--green); }
  #phone-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink); }
  #phone-content { font-family:'Poppins',sans-serif; }

  #loading { position:fixed; inset:0; z-index:50; background:linear-gradient(160deg,#0f4d3a,#1d7a5b); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; transition:opacity .5s; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading h1 { margin:0; font-size:30px; font-weight:700; }
  #loading h1 span { color:var(--gold); }
  #loading .sub { opacity:.85; font-size:14px; max-width:300px; min-height:42px; }
  #bar { width:min(280px,70vw); height:14px; border-radius:9px; background:rgba(255,255,255,.2); overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:var(--gold); border-radius:9px; transition:width .2s; }
  #pct { font-weight:600; font-size:14px; }
  #err { position:fixed; inset:0; z-index:60; display:none; background:#0f4d3a; color:#fff; padding:30px; align-items:center; justify-content:center; text-align:center; font-size:15px; }

  @media (max-width: 400px) { .needs-row { max-width:160px; } .need-item { font-size:9px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div class="top-left hideable">
    <div class="card chip title">📍 Ahmadu Bello Way<small id="zone-sub">Kaduna</small></div>
    <div class="card chip"><span id="sun">☀️</span><span id="clock">Sat · 9:00 AM</span></div>
    <div class="card tip" id="tip"><b>How to move:</b> use the thumb stick. Drag the screen to look around.</div>
  </div>

  <div id="minimap" class="hideable"><canvas id="mm" width="248" height="248"></canvas><span class="mm-label">Map</span></div>

  <div class="right-col hideable">
    <button class="btn" id="zin" aria-label="Zoom in">+</button>
    <button class="btn" id="zout" aria-label="Zoom out">−</button>
    <button class="btn" id="fit" aria-label="Re-centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
    <button class="btn" id="eye" aria-label="Hide UI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>

  <div id="joy" class="hideable"><i id="knob"></i></div>
  <div class="bottom-right hideable">
    <button class="btn wide" id="jog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v5M11 15l-1-5 4-2 2 3 3 1M10 10l-3 1"/></svg><span id="jog-t">Walk</span></button>
  </div>

  <!-- HUD: needs + money + phone dock -->
  <div id="hud-dock" class="hideable">
    <div class="money-chip">
      <span id="money-val">₦5,000</span>
      <span class="rank-chip" id="rank-val">Newcomer</span>
    </div>
    <div class="needs-row">
      <div class="need-item">🍛<div class="need-bar"><i id="need-hunger" style="width:80%;background:#2e7d4f;"></i></div></div>
      <div class="need-item">⚡<div class="need-bar"><i id="need-energy" style="width:80%;background:#2e7d4f;"></i></div></div>
      <div class="need-item">🎉<div class="need-bar"><i id="need-fun" style="width:70%;background:#2e7d4f;"></i></div></div>
      <div class="need-item">💬<div class="need-bar"><i id="need-social" style="width:60%;background:#2e7d4f;"></i></div></div>
      <div class="need-item">🚿<div class="need-bar"><i id="need-hygiene" style="width:75%;background:#2e7d4f;"></i></div></div>
      <div class="need-item">🚻<div class="need-bar"><i id="need-bladder" style="width:85%;background:#2e7d4f;"></i></div></div>
    </div>
    <button class="phone-btn" id="phone-btn" aria-label="Open phone">📱</button>
  </div>

  <button class="btn" id="eye-solo" aria-label="Show UI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg></button>
  <div id="toast"></div>
</div>

<!-- Phone modal -->
<div id="phone-modal">
  <div id="phone-card">
    <div id="phone-header">
      <h3>📱 Kaduna Phone</h3>
      <button id="phone-close">✕</button>
    </div>
    <div id="phone-content"></div>
  </div>
</div>

<!-- Auth modal -->
<div id="auth-modal" style="position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);">
  <div class="card" style="width:min(340px,90vw);padding:24px;text-align:center;">
    <h3 style="margin:0 0 6px;font-size:20px;color:var(--green);">Welcome to Kaduna</h3>
    <p style="font-size:13px;color:#666;margin:0 0 18px;">Sign in to play with others</p>
    <button id="auth-guest" class="btn wide" style="width:100%;margin-bottom:10px;">Continue as Guest</button>
    <button id="auth-google" class="btn wide" style="width:100%;margin-bottom:14px;">Google Sign In</button>
    <div style="border-top:1px solid #ddd;margin:14px 0;padding-top:14px;">
      <input id="auth-email" type="email" placeholder="Email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;font-family:inherit;font-size:14px;" />
      <input id="auth-pass" type="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-family:inherit;font-size:14px;" />
      <button id="auth-login-btn" class="btn wide on" style="width:48%;">Login</button>
      <button id="auth-signup-btn" class="btn wide" style="width:48%;margin-left:4%;">Sign Up</button>
    </div>
    <button id="auth-close" style="margin-top:10px;background:none;border:none;color:#999;cursor:pointer;font-size:13px;">Maybe later</button>
  </div>
</div>

<!-- Chat dock -->
<div id="chat-dock" style="position:fixed;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));width:260px;max-height:300px;display:none;flex-direction:column;background:var(--cream);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:35;pointer-events:auto;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #ddd;">
    <span style="font-size:13px;font-weight:600;color:var(--green);">Kaduna Chat</span>
    <span id="online-count" style="font-size:11px;color:#999;">1 here</span>
    <button onclick="toggleChat()" style="background:none;border:none;font-size:16px;cursor:pointer;color:#999;">x</button>
  </div>
  <div id="chat-log" style="flex:1;overflow-y:auto;max-height:200px;padding:4px;"></div>
  <div style="display:flex;gap:4px;padding:6px;border-top:1px solid #ddd;">
    <input id="chat-input" type="text" placeholder="Type message..." style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:12px;" onkeydown="if(event.key==='Enter')sendChatMsg()" />
    <button onclick="sendChatMsg()" style="background:var(--green);color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;">Send</button>
  </div>
</div>

<!-- Chat toggle -->
<button onclick="toggleChat()" style="position:fixed;right:12px;bottom:calc(26px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:14px;background:var(--green);color:#fff;border:2.5px solid var(--green);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--green);z-index:35;pointer-events:auto;display:flex;align-items:center;justify-content:center;">Chat<span id="chat-badge" style="position:absolute;top:-4px;right:-4px;background:#e11d48;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;display:none;">0</span></button>

<!-- Travel overlay -->
<div id="travel-overlay" style="position:fixed;inset:0;z-index:44;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,77,58,0.95);color:#fff;gap:14px;">
  <div id="travel-title" style="font-size:18px;font-weight:700;">Traveling...</div>
  <div id="travel-tip" style="font-size:13px;opacity:0.8;max-width:280px;text-align:center;"></div>
  <div style="width:min(260px,70vw);height:12px;border-radius:7px;background:rgba(255,255,255,.2);overflow:hidden;"><div id="travel-bar" style="height:100%;width:0%;background:var(--gold);border-radius:7px;transition:width .1s;"></div></div>
  <div id="travel-pct" style="font-weight:600;font-size:14px;">0%</div>
</div>

<style>
  #auth-modal.show { display: flex; }
  #chat-dock.open { display: flex; }
  #travel-overlay.show { display: flex; }
</style>

<div id="loading">
  <h1>Kaduna <span>Lifestyle</span></h1>
  <div class="sub" id="ltip">Loading Kaduna…</div>
  <div id="bar"><i></i></div>
  <div id="pct">0%</div>
</div>
<div id="err"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
